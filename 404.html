<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Claudiu Șpan</title>
  <meta name="theme-color" content="#FAFAFA">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("claudiu-span-theme");
        var theme = saved === "dark" || saved === "light"
          ? saved
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="container" style="min-height: 100svh; display: grid; place-items: center; padding-block: 3rem;">
    <section class="facts-card" style="max-width: 520px; width: 100%; text-align: center; padding: 2.5rem;">
      <p class="section-eyebrow">404</p>
      <h1 class="section-title" style="margin-bottom: 0.75rem;">Page Not Found</h1>
      <p class="section-subtitle" style="margin-inline: auto; margin-bottom: 1.5rem;">
        The page you requested does not exist or has moved.
      </p>
      <a class="btn btn-primary" href="./">Return to Portfolio</a>
    </section>
  </main>
</body>
</html>
